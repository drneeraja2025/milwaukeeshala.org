name: Sync SISLMS calendar

on:
  schedule:
    # Weekly — Mondays 14:00 UTC (~9am Central)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync from GuruVidyaZen
        env:
          SISLMS_SCHOOL_NAME: Milwaukee Marathi School
          SISLMS_CALENDAR_URL: ${{ vars.SISLMS_CALENDAR_URL }}
        run: node scripts/sync-sislms-calendar.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.sislms.json
          if git diff --staged --quiet; then
            echo "No calendar changes"
          else
            git commit -m "chore: weekly SISLMS calendar sync"
            git push
          fi
